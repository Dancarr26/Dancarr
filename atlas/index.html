<title>Bedside Assessment Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EDF1F3; --ink:#172029; --muted:#5B6B78; --line:#D6DDE2;
  --accent:#0E6B73; --accent-ink:#0A565C; --accent-soft:#DCEEF0; --accent-line:#8CC4C9;
  --flag:#B4392B; --flag-ink:#8F2C21; --flag-soft:#F9E4E0;
  --amber:#8F6400; --amber-soft:#F6ECD3;
  --figure:#B7C1C9; --figure-soft:#E4E9ED; --tissue:#F1E2D6; --tissue-2:#E6C9B5;
  --shadow:0 1px 2px rgba(23,32,41,.06),0 10px 28px rgba(23,32,41,.07);
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F161C; --surface:#172029; --surface-2:#1F2A34; --ink:#E8EEF2; --muted:#9AA9B5; --line:#2B3843;
    --accent:#5CC2C9; --accent-ink:#8ED7DC; --accent-soft:#163A3E; --accent-line:#2F7C82;
    --flag:#F2917F; --flag-ink:#F7B0A3; --flag-soft:#3E211C;
    --amber:#E5B85A; --amber-soft:#3A2F12;
    --figure:#465563; --figure-soft:#232F39; --tissue:#4A3A31; --tissue-2:#5C4638;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F161C; --surface:#172029; --surface-2:#1F2A34; --ink:#E8EEF2; --muted:#9AA9B5; --line:#2B3843;
  --accent:#5CC2C9; --accent-ink:#8ED7DC; --accent-soft:#163A3E; --accent-line:#2F7C82;
  --flag:#F2917F; --flag-ink:#F7B0A3; --flag-soft:#3E211C;
  --amber:#E5B85A; --amber-soft:#3A2F12;
  --figure:#465563; --figure-soft:#232F39; --tissue:#4A3A31; --tissue-2:#5C4638;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.app{display:grid;grid-template-columns:372px minmax(0,1fr);min-height:100vh}

/* ---------- Atlas column ---------- */
.atlas{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--display);font-weight:600;font-size:23px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.figwrap{position:relative;background:var(--surface-2);border-radius:14px;padding:26px 8px 8px}
.figwrap svg{display:block;width:100%;height:auto;max-height:440px;margin:0 auto}
.figwrap .side{position:absolute;top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.figwrap .side.l{left:12px}.figwrap .side.r{right:12px}
.figwrap svg *{vector-effect:non-scaling-stroke}
.body .mp{fill:var(--figure-soft);stroke:var(--figure);stroke-width:.8;transition:fill .25s}
.body .mp.hair{fill:var(--figure)}
.body .mp.on{fill:var(--accent);fill-opacity:.42;stroke:var(--accent)}
.body .ol{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-opacity:.7}
.hl{fill:var(--accent);stroke:var(--accent);fill-opacity:.36;stroke-width:2}
.halo{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 6;stroke-opacity:.85}
.dotpt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.joint{fill:var(--accent);fill-opacity:.35;stroke:var(--accent);stroke-width:2}
.leader{stroke:var(--muted);stroke-width:1;fill:none;stroke-opacity:.7}
.pin{cursor:pointer}
.pin circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.5;transition:fill .2s,stroke .2s}
.pin text{fill:var(--ink);font-family:var(--mono);font-size:22px;font-weight:500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.vtoggle{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.vt{border:0;background:none;border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.vt.on{background:var(--accent);color:#fff}
.vt:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pin:hover circle,.pin:focus-visible circle{stroke:var(--accent);stroke-width:2}
.pin.on circle{fill:var(--accent);stroke:var(--accent)}
.pin.on text{fill:#fff}
.pin:focus{outline:none}
.pin:focus-visible circle{stroke-width:3}
.figcap{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 0;font-size:12.5px;color:var(--muted)}
.figcap b{color:var(--ink);font-weight:700}

.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:7px 8px;cursor:pointer;color:var(--ink)}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row.on{background:var(--accent-soft)}
.row .num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);background:var(--surface)}
.row.on .num{background:var(--accent);border-color:var(--accent);color:#fff}
.row.done .num{border-color:var(--accent);color:var(--accent)}
.row .name{font-size:14.5px;line-height:1.25}
.row .name small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.02em}
.row .prog{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .prog{color:var(--accent-ink)}
.atlas-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:6px}
.linkbtn{background:none;border:0;padding:4px 6px;color:var(--accent-ink);cursor:pointer;border-radius:6px;font-size:12.5px}
.linkbtn:hover{background:var(--surface-2)}
.credit{font-size:11px;color:var(--muted);margin:0;line-height:1.4}
.credit a{color:var(--muted)}

/* ---------- Detail pane ---------- */
.detail{padding:30px clamp(16px,4vw,60px) 110px;max-width:900px;width:100%}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow .loc{padding:2px 8px;border:1px solid var(--line);border-radius:999px;letter-spacing:.04em;text-transform:none;font-size:11.5px}
h2.title{font-family:var(--display);font-weight:500;font-size:clamp(30px,4vw,40px);line-height:1.08;letter-spacing:-.015em;margin:8px 0 12px;text-wrap:balance}
.lede{font-size:16px;max-width:66ch;margin:0 0 6px}
.lede b{font-weight:700}
.nerves{font-size:14px;color:var(--muted);max-width:66ch;margin:4px 0 0}
.nerves b{color:var(--ink);font-family:var(--mono);font-weight:500;font-size:12.5px}
section.blk{margin-top:30px}
.blk h3{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.blk h3::after{content:"";flex:1;height:1px;background:var(--line)}
figure.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;box-shadow:var(--shadow)}
figure.fig .scroll{overflow-x:auto}
figure.fig svg.dg{display:block;width:100%;height:auto;min-width:300px;max-width:100%;margin:0 auto;color:var(--ink);font-family:var(--mono);font-size:11px}
figure.fig figcaption{font-size:13px;color:var(--muted);margin-top:10px;max-width:70ch}
.dg *{vector-effect:non-scaling-stroke}
.dg text{fill:currentColor;stroke:none;font-family:var(--mono)}
.dg .t10{font-size:10px}.dg .t12{font-size:12px}.dg .t13{font-size:13px;font-weight:500}
.dg .b{font-weight:500}
.dg .mu{color:var(--muted)}
.dg .ln{stroke:currentColor;fill:none;stroke-width:1.5}
.dg .th{stroke:currentColor;fill:none;stroke-width:1}
.dg .lt{stroke:var(--line);fill:none;stroke-width:1}
.dg .dash{stroke-dasharray:4 3}
.dg .sil .mp{fill:var(--figure-soft);stroke:var(--figure);stroke-width:.8}
.dg .sil .mp.hair{fill:var(--figure)}
.dg .sil .ol{fill:none;stroke:var(--figure);stroke-width:1.4}
.dg .ac{stroke:var(--accent);fill:none;stroke-width:1.8}
.dg .acf{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.dg .acd{fill:var(--accent);stroke:none}
.dg .act{fill:var(--accent-ink)}
.dg .fl{stroke:var(--flag);fill:none;stroke-width:1.8}
.dg .flf{fill:var(--flag-soft);stroke:var(--flag);stroke-width:1.5}
.dg .fld{fill:var(--flag);stroke:none}
.dg .flt{fill:var(--flag-ink)}
.dg .am{fill:var(--amber-soft);stroke:var(--amber);stroke-width:1.5}
.dg .amt{fill:var(--amber)}
.dg .gr{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.dg .grf{fill:var(--figure-soft);stroke:var(--figure);stroke-width:1}
.dg .tis{fill:var(--tissue);stroke:var(--tissue-2);stroke-width:1}
.dg .tis2{fill:var(--tissue-2);stroke:none}
.dg .white{fill:var(--surface)}
.dg .pupil{fill:var(--ink)}
.dg .mark{fill:var(--flag);fill-opacity:.85;stroke:var(--surface);stroke-width:1.5;cursor:pointer}
.dg .clickable{cursor:crosshair}

.landmarks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 22px;margin:0;padding:0;list-style:none;font-size:14.5px}
.landmarks li{padding:6px 0;border-bottom:1px solid var(--line)}
.landmarks b{font-weight:700}

.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.check li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.check li:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line)}
.check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:6px;background:var(--surface);cursor:pointer;display:grid;place-items:center}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check label{cursor:pointer;font-size:15px;line-height:1.45}
.check label b{font-weight:700}
.check label span{color:var(--muted)}
.check li:has(input:checked) label span{color:var(--ink)}
.check label mark{background:var(--flag-soft);color:var(--flag-ink);padding:0 3px;border-radius:3px}
.check label em{font-style:normal;font-family:var(--mono);font-size:13px}

.how{background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:15px;max-width:72ch}
.how b{font-weight:700}
.callout{border-left:4px solid var(--flag);background:var(--flag-soft);border-radius:0 12px 12px 0;padding:14px 18px;max-width:72ch}
.callout h4{margin:0 0 6px;font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--flag-ink)}
.callout p{margin:0 0 6px;font-size:15px}
.callout ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.callout li{margin:3px 0}
.callout b{font-weight:700}
.scale{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;align-items:baseline;margin:0;max-width:70ch}
.scale dt{font-family:var(--mono);font-size:13px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--surface-2);text-align:center;white-space:nowrap}
.scale dt.ok{background:var(--accent-soft);color:var(--accent-ink)}
.scale dt.bad{background:var(--flag-soft);color:var(--flag-ink)}
.scale dd{margin:0}
.scales{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.scales h5{margin:0 0 8px;font-size:14px;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.05)}
.btn[disabled]{opacity:.45;cursor:default}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.pager .btn{max-width:46%;text-align:left;line-height:1.3}
.pager .btn small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager .btn.primary small{color:rgba(255,255,255,.75)}
.pager .btn.primary{text-align:right}

/* mobile bar */
.mbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .atlas{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px 12px}
  .figwrap svg{max-height:300px}
  .list{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
  .row{grid-template-columns:24px auto;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;flex:0 0 auto}
  .row .num{width:22px;height:22px;font-size:10px}
  .row .name{font-size:13.5px}.row .name small{display:none}.row .prog{display:none}
  .atlas-foot{margin-top:0}
  .detail{padding-bottom:120px}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));justify-content:space-between;align-items:center;gap:10px}
  .mbar .pos{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>

<div class="app">
  <aside class="atlas" aria-label="Body atlas navigation">
    <div class="brand"><h1>Bedside Assessment Atlas</h1><small>RN · head to toe</small></div>
    <div class="figwrap">
      <span class="side l">Patient's R</span><span class="side r">Patient's L</span>
      <svg id="bodyfig" viewBox="40 80 700 1300" role="group" aria-label="Whole-body figure with numbered assessment regions"></svg>
      <div class="figcap"><div class="vtoggle" role="group" aria-label="Figure view"><button type="button" class="vt" data-view="front" aria-pressed="true">Front</button><button type="button" class="vt" data-view="back" aria-pressed="false">Back</button></div><span id="figstate"></span></div>
    </div>
    <ol class="list" id="list"></ol>
    <div class="atlas-foot"><span id="overall"></span><button class="linkbtn" id="reset" type="button">Reset all ticks</button></div>
    <p class="credit">Body figure adapted from <a href="https://github.com/HichamELBSI/react-native-body-highlighter">react-native-body-highlighter</a>, © 2022 ELABBASSI Hicham, MIT licence.</p>
  </aside>
  <main class="detail" id="detail" aria-live="polite"></main>
</div>
<div class="mbar" id="mbar">
  <button class="btn" id="mprev" type="button">← Previous</button>
  <span class="pos" id="mpos"></span>
  <button class="btn primary" id="mnext" type="button">Next →</button>
</div>

<script src="body-art.js"></script>
<script>
/* ---------- shared drawing helpers ---------- */
const SVG=(w,h,label,inner)=>`<svg class="dg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg>`;
const ARROW=id=>`<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>`;
const ART=window.BODY_ART;
const artPaths=view=>ART[view].map(p=>Object.values(p.parts).flat().map(d=>`<path d="${d}" class="mp${p.slug==='hair'?' hair':''}" data-slug="${p.slug}"/>`).join('')).join('')+`<path d="${ART.outline[view]}" class="ol"/>`;
/* figure coordinates: front 0..724 x, back 724..1448 x, both 80..1380 y (source viewBox 1448 tall) */
const sil=(x,y,s,view='front')=>`<g class="sil" transform="translate(${x} ${y}) scale(${s}) translate(${view==='back'?-724:0} -80)">${artPaths(view)}</g>`;
const dot=(x,y,cls='acd',r=4)=>`<circle cx="${x}" cy="${y}" r="${r}" class="${cls}"/>`;
const lbl=(x,y,t,cls='',anchor='start')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${t}</text>`;
const lead=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="th mu"/>`;
const num=(x,y,n,cls='acf')=>`<circle cx="${x}" cy="${y}" r="8" class="${cls}"/><text x="${x}" y="${y+0.5}" text-anchor="middle" dominant-baseline="central" class="t10 b">${n}</text>`;

/* ---------- diagrams ---------- */
const D={};
D.vitals=()=>{
  const s=0.18,ox=10,oy=8,p=(x,y)=>[ox+x*s,oy+(y-80)*s];
  const pts=[['Temporal',312,168,22],['Carotid',338,286,50],['Apex · 5th ICS MCL',430,432,78],['Brachial · antecubital',214,500,104],['Radial · lateral wrist',132,700,130],['Femoral · groin',300,665,152],['Popliteal · behind knee',296,1010,200],['Posterior tibial · behind medial malleolus',312,1268,246],['Dorsalis pedis · dorsum of foot',276,1305,272]];
  let g=sil(ox,oy,s);
  pts.forEach(([n,x,y,ly])=>{const [px,py]=p(x,y);g+=lead(px,py,150,ly)+dot(px,py)+lbl(154,ly+4,n);});
  g+=lbl(10,296,"Patient's R",'t10 mu')+lbl(140,296,"Patient's L",'t10 mu','end');
  // chest auscultation
  const cx=330;
  let c=`<g transform="translate(${cx} 18)">`;
  c+=`<path d="M30 30 Q30 8 60 8 L85 14 L95 0 L105 14 L130 8 Q160 8 160 30 L166 190 Q95 215 24 190 Z" class="grf"/>`;
  c+=`<rect x="84" y="16" width="22" height="150" rx="6" class="gr"/>`;
  [40,70,100,130,160].forEach((y,i)=>{c+=`<line x1="40" y1="${y}" x2="84" y2="${y+6}" class="lt"/><line x1="106" y1="${y+6}" x2="150" y2="${y}" class="lt"/>`;});
  c+=lbl(95,45,'2',"t10 mu",'middle')+lbl(95,75,'3','t10 mu','middle')+lbl(95,105,'4','t10 mu','middle')+lbl(95,135,'5','t10 mu','middle');
  c+=`<line x1="140" y1="0" x2="140" y2="200" class="lt dash"/>`+lbl(140,214,'mid-clavicular','t10 mu','middle');
  const areas=[['A',72,44,'Aortic · R 2nd ICS'],['P',118,44,'Pulmonic · L 2nd ICS'],['T',118,120,'Tricuspid · L lower sternal border'],['M',146,140,'Mitral / apex · L 5th ICS MCL']];
  areas.forEach(([k,x,y])=>{c+=`<circle cx="${x}" cy="${y}" r="11" class="acf"/>`+lbl(x,y+4,k,'t12 b act','middle');});
  c+=lbl(20,-4,"Patient's R",'t10 mu')+lbl(170,-4,"Patient's L",'t10 mu','end');
  c+=`</g>`;
  c+=lbl(16,322,'A  Aortic · R 2nd ICS, sternal edge')+lbl(16,338,'P  Pulmonic · L 2nd ICS, sternal edge')+lbl(290,322,'T  Tricuspid · L lower sternal edge')+lbl(290,338,'M  Mitral (apex) · L 5th ICS, MCL');
  return SVG(560,350,'Pulse points on a whole-body figure and the four cardiac auscultation areas on the anterior chest',g+c);
};
D.brain=()=>{
  let g=ARROW('ab');
  g+=`<path d="M40 122 C40 62 100 28 172 28 C252 28 322 60 322 112 C322 152 282 172 242 176 C224 200 182 200 160 182 C122 182 100 172 90 156 C60 152 40 142 40 122 Z" class="grf"/>`;

{id:'neuro',n:2,name:'Neurological · cognition, mood, speech',short:'Neuro',loc:'Head',

{id:'nose',n:5,name:'Nose & sinuses',short:'Nose',loc:'Head',

 diagram:D.chest,caption:'The right middle lobe can only be heard from the front, low on the right. The lower lobes occupy most of the back, which is why a chest listened to only from the front misses most basal pathology.',

 assess:[['Smoking','current, past, pack-years.'],['Respiratory effort','at rest versus on activity. Ask what they can do before becoming short of breath.'],['Colour of lips and mucous membranes','pink, cyanosed (central cyanosis in the lips and tongue means hypoxaemia), pale, jaundiced.'],['Posture','tripod position, leaning forward on the arms, indicates significant effort.'],['Shape of chest','normal, barrel (increased AP diameter, chronic air trapping), pectus excavatum or carinatum, kyphoscoliosis.'],['Symmetry and expansion','hands flat on the posterior chest, thumbs meeting at the spine; watch the thumbs separate equally on inspiration.'],['Accessory muscle use','a sign of work, visible at the neck.'],['Palpation of the thorax','tenderness (suggests a musculoskeletal or rib cause rather than a lung one), crepitus, masses.'],['Auscultation','compare side to side at each level, never down one side then the other. Nine levels is the usual sequence: three anterior, six posterior.'],['Wheeze','musical, usually expiratory, from narrowed airways. Note where.'],['Crackles','discontinuous. Fine late-inspiratory basal crackles suggest fluid or fibrosis; coarse crackles that clear with coughing suggest secretions. Note where, and whether dry, moist or productive.'],['Cough and sputum','colour, amount, consistency, odour, and whether it is new.'],['Clubbing','loss of the nail-bed angle. Suggests chronic hypoxia, bronchiectasis or malignancy.']],
 flags:['Central cyanosis, tripod posture, accessory muscle use, or a respiratory rate above 24 at rest: escalate.','New unilateral reduced breath sounds with tracheal deviation.','New fine basal crackles with ankle oedema and weight gain: think fluid overload.']},

{id:'abdomen',n:9,name:'Abdomen · gastrointestinal',short:'Abdomen',loc:'Abdomen',
 structures:'By quadrant: right upper (liver, gallbladder, hepatic flexure), left upper (stomach, spleen, splenic flexure, pancreas tail), right lower (caecum, appendix, right ovary), left lower (sigmoid colon, left ovary). Epigastric, umbilical and suprapubic regions centrally.',
 diagram:D.abdomen,caption:'Facing the patient, their right is on your left. Record tenderness by quadrant, and by the nine regions if you need to be more precise.',
 assess:[['Inspection','soft, distended, scars, hernia, stoma, bruising. Flank or periumbilical bruising is a late sign of retroperitoneal bleeding.'],['Bowel sounds','present and normal; hyperactive (early obstruction, gastroenteritis); hypoactive or absent (ileus, late obstruction, peritonitis). Listen in one place for long enough before calling them absent.'],['Palpation','light first across all quadrants, then deep, watching the face not the hand. Soft and non-tender; tender; guarding (involuntary muscle tensing); rigid. <b>Painful quadrant last.</b>'],['Site of tenderness','record by quadrant.'],['Masses','site, size, mobility, pulsatility.'],['Reflux and heartburn','frequency, night-time symptoms, what relieves it.'],['History of ulcer or gastritis','and current NSAID or anticoagulant use.'],['Nausea, vomiting, epigastric pain','onset, pattern, relation to food.']],
 how:'<b>Order matters: inspect, auscultate, percuss, palpate.</b> Palpating first changes the bowel sounds you then hear.',
 flags:['A pulsatile, expansile central mass is an abdominal aortic aneurysm until excluded. Do not press on it.','Rigid abdomen with guarding and absent bowel sounds: peritonitis until proven otherwise.','Flank or periumbilical bruising in someone on anticoagulants.']},

{id:'bowel',n:10,name:'Bowel & stoma',short:'Bowel',loc:'Abdomen',
 structures:'Colon (caecum, ascending, transverse, descending, sigmoid, rectum), terminal ileum, and the abdominal wall where a stoma is brought out.',
 diagram:D.colon,caption:'Where a stoma sits tells you what to expect from it: an ileostomy in the right iliac fossa puts out liquid all day, an end colostomy in the left iliac fossa puts out formed stool. Bristol types 3 and 4 are the target.',
 assess:[['Usual bowel habit','their normal, not a textbook normal.'],['Continence of faeces','continent, occasional, regular; and whether it is overflow.'],['Stool type','Bristol Stool Chart, 1 to 7. <em>Types 3 and 4</em> are the target.'],['Aperients','what, how often, and whether effective. Opioids, anticholinergics, iron and calcium channel blockers all constipate.'],['Stoma type','colostomy, ileostomy, urostomy, jejunostomy; end or loop.'],['Stoma colour','should be pink to red and moist. <mark>Pale, dusky or black</mark> indicates compromised blood supply and is urgent.'],['Peristomal skin','intact, red, excoriated, leaking under the flange.'],['Output','type and volume; bag change due or completed.'],['Symptoms','pain, bleeding, pus, bloating.']],
 flags:['A dusky or black stoma is a surgical emergency.','Overflow diarrhoea around a faecal impaction presents as incontinence of liquid stool in someone who “has diarrhoea”. Examine before treating the diarrhoea.','New change in bowel habit, blood in the stool, or unexplained weight loss needs investigation.']},

{id:'urinary',n:11,name:'Continence & urinary',short:'Continence',loc:'Pelvis',

 assess:[['Continence','continent, or the pattern of incontinence (types below).'],['Aids used','type, size, how many per day, who funds them.'],['Toilet access','can they get there independently, and is the path safe at night. Toileting at night is a leading falls scenario.'],['Nocturia','how many times overnight.'],['Catheter or other drainage','type, size, date last changed, drainage, and the plan for removal.'],['Urinalysis','only with symptoms. <b>Asymptomatic bacteriuria is common in older adults and should not be treated on a dipstick alone.</b>']],
 scales:[['Incontinence type',[['Stress','on cough, laugh, lift · pelvic floor weakness'],['Urge','sudden, can’t defer · overactive detrusor'],['Mixed','both of the above'],['Overflow','constant dribble, poor stream · retention, obstruction'],['Functional','can’t get there in time · mobility, cognition, environment']]]],

{id:'limbs',n:12,name:'Extremities & peripheral circulation',short:'Limbs',loc:'Arms & legs',
 structures:'Limbs, peripheral arteries and veins, nails, joints, and the lymphatic drainage.',
 diagram:D.limbs,caption:'Left: the leg arterial tree and where to feel each pulse. Middle: pitting depth, to scale. Right: the nail-fold angle, normal versus clubbed.',
 assess:[['Colour of limbs','pallor, redness, mottling, cyanosis; and whether it changes with elevation or dependency.'],['Temperature','compare side to side with the back of your hand.'],['Capillary refill','press the nail bed for 5 seconds and release. <em>Under 2 s</em> normal, <em>over 3 s</em> delayed.'],['Peripheral pulses','radial and pedal, each side: present, weak, absent.'],['Oedema','location, and pitting depth graded 1+ to 4+ (see figure). Bilateral ankle oedema is usually cardiac, venous or drug-related. <mark>Unilateral, warm, tender swelling suggests DVT.</mark>'],['Compression stockings or leg elevation','in use, correctly fitted, tolerated. Compression on an arterial leg causes harm; the ABPI matters.'],['Varicose veins','site, skin changes, ulceration.'],['Nails','colour (pinkish normal; blue, black, white, yellow, green each mean something different), shape, clubbing, and care: well kept, overgrown, thickened, fungal, podiatry in place.'],['Tremor, contractures, foot deformity','and their effect on function.'],['Footwear','appropriate, unsafe, slippers only, barefoot. This is a falls finding as much as a clothing one.']],

 flags:['A cool, pale, pulseless, painful limb is acute arterial occlusion until excluded: urgent.','Unilateral warm, tender calf swelling: DVT pathway.','Compression stockings on a leg with absent pulses or an ABPI under 0.8: stop and refer.']},

{id:'skin',n:13,name:'Skin',short:'Skin',loc:'Whole body',
 structures:'Epidermis, dermis, subcutaneous tissue, hair follicles, sebaceous and sweat glands, and the pressure-bearing bony prominences.',
 diagram:D.skin,caption:'Every red dot is a bony prominence to look at and touch. Stage 1 is non-blanching redness over one of them; it is the last point at which the injury is fully reversible.',

 scales:[['Pressure injury stage',[['1','Non-blanching erythema, skin intact'],['2','Partial thickness · shallow open wound or blister'],['3','Full thickness · fat visible, no bone or tendon'],['4','Full thickness · bone, tendon or muscle exposed','bad'],['U','Unstageable · base hidden by slough or eschar'],['DTI','Intact, purple or maroon, boggy · deep tissue injury','bad']]]],
 flags:['Non-blanching erythema over a bony prominence is a stage 1 pressure injury. Offload it now.','A skin tear, a pressure injury and a moisture lesion are three different things with three different management paths. Name it correctly.','Any wound on a foot with reduced sensation or absent pulses: same-week podiatry or high-risk foot review.']},

{id:'msk',n:14,name:'Musculoskeletal, mobility & falls',short:'Mobility',loc:'Whole body',

 diagram:D.msk,caption:'Work through each marked joint on both sides. Turning is where instability shows first, so watch the turn during the gait assessment.',

 scales:[['Muscle strength',[['0','No movement','bad'],['1','Flicker of contraction, no movement'],['2','Full range with gravity eliminated'],['3','Full range against gravity'],['4','Against gravity and some resistance, but weak'],['5','Normal','ok']]]],

const VIEWBOX={front:'40 80 700 1300',back:'764 80 700 1300'};
function drawBody(){
  const view=state.view, svg=document.getElementById('bodyfig');
  svg.setAttribute('viewBox',VIEWBOX[view]);
  const act=state.active, m=(MAP[act]||{})[view]||{};
  const onParts=new Set(m.parts||[]);
  let s=`<g class="body">`+ART[view].map(p=>Object.values(p.parts).flat().map(d=>`<path d="${d}" class="mp${p.slug==='hair'?' hair':''}${onParts.has(p.slug)?' on':''}"/>`).join('')).join('')+`<path d="${ART.outline[view]}" class="ol"/></g>`;
  const ob=view==='front'?[49,96,679,1351]:[769,96,1399,1351];
  if(m.halo)s+=`<rect x="${ob[0]-14}" y="${ob[1]-14}" width="${ob[2]-ob[0]+28}" height="${ob[3]-ob[1]+28}" rx="60" class="halo"/>`;
  if(m.shapes)s+=`<g class="hl on">${m.shapes}</g>`;
  if(m.dots)s+=m.dots.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" class="dotpt"/>`).join('');
  if(m.joints)s+=m.joints.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="13" class="joint"/>`).join('');
  REGIONS.forEach(r=>{const p=(PINS[r.id]||{})[view];if(!p)return;if(p[2])s+=`<line x1="${p[2][0]}" y1="${p[2][1]}" x2="${p[0]-16}" y2="${p[1]}" class="leader"/>`;});
  REGIONS.forEach(r=>{const p=(PINS[r.id]||{})[view];if(!p)return;s+=`<g class="pin${r.id===act?' on':''}" data-id="${r.id}" tabindex="0" role="button" aria-label="${r.n}. ${r.name}"><title>${r.n}. ${r.name}</title><circle cx="${p[0]}" cy="${p[1]}" r="17"/><text x="${p[0]}" y="${p[1]}">${r.n}</text></g>`;});
  svg.innerHTML=s;
  svg.querySelectorAll('.pin').forEach(el=>{
    el.addEventListener('click',()=>show(el.dataset.id));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(el.dataset.id);}});
  });
  document.querySelectorAll('.vt').forEach(b=>{const on=b.dataset.view===view;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  document.querySelector('.side.l').textContent=view==='front'?"Patient's R":"Patient's L";
  document.querySelector('.side.r').textContent=view==='front'?"Patient's L":"Patient's R";
}
function setView(v){state.view=v;save();drawBody();}

/* ---------- state ---------- */
const KEY='bedside-atlas-v1';
let state={active:'vitals',view:'front',checks:{},marks:[]};
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&typeof s==='object')state={...state,...s};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const idx=id=>REGIONS.findIndex(r=>r.id===id);
const doneCount=r=>(state.checks[r.id]||[]).length;

/* ---------- render ---------- */
function renderList(){
  const ol=document.getElementById('list');
  ol.innerHTML=REGIONS.map(r=>{const d=doneCount(r),t=r.assess.length;return `<li><button type="button" class="row${r.id===state.active?' on':''}${d===t?' done':''}" data-id="${r.id}"><span class="num">${r.n}</span><span class="name">${r.name}<small>${r.loc}</small></span><span class="prog">${d}/${t}</span></button></li>`;}).join('');
  ol.querySelectorAll('.row').forEach(b=>b.addEventListener('click',()=>show(b.dataset.id)));
  const total=REGIONS.reduce((a,r)=>a+r.assess.length,0),done=REGIONS.reduce((a,r)=>a+doneCount(r),0);
  document.getElementById('overall').textContent=`${done} of ${total} items ticked`;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function renderDetail(){
  const r=REGIONS[idx(state.active)],i=idx(state.active),prev=REGIONS[i-1],next=REGIONS[i+1];
  const checks=state.checks[r.id]||[];
  let h=`<div class="eyebrow"><span>Region ${r.n} of 15</span><span class="loc">${r.loc}</span></div>`;
  h+=`<h2 class="title">${r.name}</h2>`;
  h+=`<p class="lede"><b>Structures.</b> ${r.structures}</p>`;
  if(r.nerves)h+=`<p class="nerves">${r.nerves}</p>`;
  h+=`<section class="blk"><h3>Where to look</h3><figure class="fig"><div class="scroll">${r.diagram()}</div><figcaption>${r.caption}</figcaption></figure></section>`;
  if(r.landmarks)h+=`<section class="blk"><h3>Landmarks</h3><ul class="landmarks">${r.landmarks.map(([a,b])=>`<li><b>${a}</b> · ${b}</li>`).join('')}</ul></section>`;
  if(r.how)h+=`<section class="blk"><h3>How</h3><div class="how">${r.how}</div></section>`;
  h+=`<section class="blk"><h3>Assess · ${checks.length}/${r.assess.length}</h3><ul class="check">${r.assess.map(([t,d],k)=>`<li><input type="checkbox" id="c-${r.id}-${k}" data-k="${k}"${checks.includes(k)?' checked':''}><label for="c-${r.id}-${k}"><b>${t}</b> <span>${d}</span></label></li>`).join('')}</ul></section>`;
  if(r.scales)h+=`<section class="blk"><h3>Scales</h3><div class="scales">${r.scales.map(([n,rows])=>`<div><h5>${n}</h5><dl class="scale">${rows.map(([k,v,c])=>`<dt class="${c||''}">${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`).join('')}</div></section>`;
  h+=`<section class="blk"><div class="callout"><h4>Red flags · what matters</h4><ul>${r.flags.map(f=>`<li>${f}</li>`).join('')}</ul></div></section>`;
  if(r.id==='pain')h+=`<div class="tools"><button type="button" class="btn" id="clearmarks">Clear pain marks</button></div>`;
  h+=`<nav class="pager">${prev?`<button type="button" class="btn" data-go="${prev.id}"><small>Previous · ${prev.n}</small>${prev.short}</button>`:'<span></span>'}${next?`<button type="button" class="btn primary" data-go="${next.id}"><small>Next · ${next.n}</small>${next.short}</button>`:`<button type="button" class="btn primary" data-go="vitals"><small>Finished</small>Back to the start</button>`}</nav>`;
  const d=document.getElementById('detail');
  d.innerHTML=h;
  d.querySelectorAll('.check input').forEach(cb=>cb.addEventListener('change',()=>{
    const k=+cb.dataset.k,arr=new Set(state.checks[r.id]||[]);cb.checked?arr.add(k):arr.delete(k);state.checks[r.id]=[...arr].sort((a,b)=>a-b);save();renderList();
    d.querySelector('.blk h3').textContent=`Assess · ${arr.size}/${r.assess.length}`;
    const assessH3=[...d.querySelectorAll('.blk h3')].find(x=>x.textContent.startsWith('Assess'));if(assessH3)assessH3.textContent=`Assess · ${arr.size}/${r.assess.length}`;
  }));
  d.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.go);window.scrollTo({top:0});}));
  if(r.id==='pain')initPainMap();
  // mobile bar + figure state
  document.getElementById('mpos').textContent=`${r.n} / 15 · ${r.short}`;
  document.getElementById('mprev').disabled=!prev;document.getElementById('mnext').disabled=!next;
  document.getElementById('figstate').innerHTML=`<b>${r.n}</b> ${r.short}`;
  drawBody();
}
function initPainMap(){
  const svg=document.querySelector('#painmap')?.closest('svg');if(!svg)return;
  const marks=svg.querySelector('#painmarks');
  const draw=()=>{marks.innerHTML=state.marks.map((m,i)=>`<circle cx="${m[0]}" cy="${m[1]}" r="7" class="mark" data-i="${i}"/>`).join('');marks.querySelectorAll('.mark').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();state.marks.splice(+c.dataset.i,1);save();draw();}));};
  svg.addEventListener('click',e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());if(p.y>290)return;state.marks.push([Math.round(p.x),Math.round(p.y)]);save();draw();});
  draw();
  document.getElementById('clearmarks')?.addEventListener('click',()=>{state.marks=[];save();draw();});
}
function show(id){
  if(!REGIONS.some(r=>r.id===id))return;
  state.active=id;
  const other=state.view==='front'?'back':'front';
  if(!(MAP[id]||{})[state.view]&&(MAP[id]||{})[other])state.view=other;
  save();renderList();renderDetail();
  if(window.innerWidth<=900){document.getElementById('detail').scrollIntoView({block:'start'});}
  const row=document.querySelector(`.row[data-id="${id}"]`);if(row&&window.innerWidth<=900)row.scrollIntoView({inline:'center',block:'nearest'});
}
document.getElementById('mprev').addEventListener('click',()=>{const i=idx(state.active);if(i>0){show(REGIONS[i-1].id);window.scrollTo({top:0});}});
document.getElementById('mnext').addEventListener('click',()=>{const i=idx(state.active);if(i<REGIONS.length-1){show(REGIONS[i+1].id);window.scrollTo({top:0});}});
document.getElementById('reset').addEventListener('click',()=>{state.checks={};save();renderList();renderDetail();});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,button,[contenteditable]'))return;
  const i=idx(state.active);
  if(e.key==='ArrowRight'&&i<REGIONS.length-1)show(REGIONS[i+1].id);
  if(e.key==='ArrowLeft'&&i>0)show(REGIONS[i-1].id);
});
document.querySelectorAll('.vt').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
renderList();renderDetail();
</script>
